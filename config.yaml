# LLM Evaluation Suite Configuration

models:
  - Qwen2.5-0.5B-Instruct
  - Qwen2.5-1.5B-Instruct
  - Qwen2.5-3B-Instruct
  - Qwen3.5-2B
  - Qwen3.5-4B
  - gemma-2-2b-it
  - gemma-3-1b-it
  - gemma-3-4b-it
  - gemma-4-E2B-it
  # - Llama-3.2-1B-Instruct
  # - Llama-3.2-3B-Instruct

datasets:
  - mmlu
  - mmlu_pro
  - gsm8k
  - hellaswag
  - truthfulqa

options:
  gpus: auto       # Set to 'auto' to auto-detect system GPUs, or specify list (e.g. [0, 1])
  batch_size: 8    # Default batch size for GPU inference
  limit: null         # Set to an integer (e.g. 50) for testing, or null for full dataset evaluation
  debug: false     # Print detailed per-sample prompts and response analysis
  output_dir: outputs
